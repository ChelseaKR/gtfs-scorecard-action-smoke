name: Verify GTFS Scorecard Action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-release:
    name: Protected release v1.4.0
    runs-on: ubuntu-latest
    steps:
      - name: Run GTFS Scorecard gate
        id: gate
        uses: ChelseaKR/gtfs-scorecard@v1.4.0
        with:
          feed-url: https://unitrans.ucdavis.edu/media/gtfs/Unitrans_GTFS.zip
          country: US
          name: Unitrans downstream smoke test
          json: output/scorecard.json
          html: output/scorecard.html

      - name: Verify outputs
        shell: bash
        env:
          GRADE: ${{ steps.gate.outputs.grade }}
          SCORE: ${{ steps.gate.outputs.score }}
          PASSED: ${{ steps.gate.outputs.passed }}
          RESULT_JSON: ${{ steps.gate.outputs.result-json }}
        run: |
          set -euo pipefail
          test -n "$GRADE"
          test -n "$SCORE"
          test "$PASSED" = "true"
          test -s "$RESULT_JSON"
          test -s output/scorecard.html
          jq -e '.overall.score | numbers' "$RESULT_JSON" >/dev/null

  floating-major:
    name: Floating major v1
    runs-on: ubuntu-latest
    steps:
      - name: Run GTFS Scorecard gate
        id: gate
        uses: ChelseaKR/gtfs-scorecard@v1
        with:
          feed-url: https://unitrans.ucdavis.edu/media/gtfs/Unitrans_GTFS.zip
          country: US
          name: Unitrans downstream smoke test
          json: output/scorecard.json
          html: output/scorecard.html

      - name: Verify outputs
        shell: bash
        env:
          GRADE: ${{ steps.gate.outputs.grade }}
          SCORE: ${{ steps.gate.outputs.score }}
          PASSED: ${{ steps.gate.outputs.passed }}
          RESULT_JSON: ${{ steps.gate.outputs.result-json }}
        run: |
          set -euo pipefail
          test -n "$GRADE"
          test -n "$SCORE"
          test "$PASSED" = "true"
          test -s "$RESULT_JSON"
          test -s output/scorecard.html
          jq -e '.overall.score | numbers' "$RESULT_JSON" >/dev/null
