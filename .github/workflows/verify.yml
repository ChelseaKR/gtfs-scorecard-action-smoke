name: Verify GTFS Scorecard Action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-aliases:
    name: Public release aliases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out alias assertions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify public tags resolve to the executed commits
        shell: bash
        run: |
          bash scripts/assert-release-ref.sh \
            https://github.com/ChelseaKR/gtfs-scorecard.git \
            v1.3.0 \
            715b8d5cd967522702842d46ab2c3b79c1b0a781
          bash scripts/assert-release-ref.sh \
            https://github.com/ChelseaKR/gtfs-scorecard.git \
            v1 \
            715b8d5cd967522702842d46ab2c3b79c1b0a781

  protected-release:
    name: Protected release v1.3.0
    needs: release-aliases
    runs-on: ubuntu-latest
    steps:
      - name: Run GTFS Scorecard gate
        id: gate
        uses: ChelseaKR/gtfs-scorecard@715b8d5cd967522702842d46ab2c3b79c1b0a781 # v1.3.0
        with:
          feed-url: https://unitrans.ucdavis.edu/media/gtfs/Unitrans_GTFS.zip
          country: US
          name: Unitrans downstream smoke test
          json: output/scorecard.json
          html: output/scorecard.html

      - name: Verify outputs
        shell: bash
        env:
          GRADE: ${{ steps.gate.outputs.grade }}
          SCORE: ${{ steps.gate.outputs.score }}
          PASSED: ${{ steps.gate.outputs.passed }}
          RESULT_JSON: ${{ steps.gate.outputs.result-json }}
        run: |
          set -euo pipefail
          test -n "$GRADE"
          test -n "$SCORE"
          test "$PASSED" = "true"
          test -s "$RESULT_JSON"
          test -s output/scorecard.html
          jq -e '.overall.score | numbers' "$RESULT_JSON" >/dev/null

  floating-major:
    name: Floating major v1
    needs: release-aliases
    runs-on: ubuntu-latest
    steps:
      - name: Run GTFS Scorecard gate
        id: gate
        uses: ChelseaKR/gtfs-scorecard@715b8d5cd967522702842d46ab2c3b79c1b0a781 # v1 peeled 2026-07-23
        with:
          feed-url: https://unitrans.ucdavis.edu/media/gtfs/Unitrans_GTFS.zip
          country: US
          name: Unitrans downstream smoke test
          json: output/scorecard.json
          html: output/scorecard.html

      - name: Verify outputs
        shell: bash
        env:
          GRADE: ${{ steps.gate.outputs.grade }}
          SCORE: ${{ steps.gate.outputs.score }}
          PASSED: ${{ steps.gate.outputs.passed }}
          RESULT_JSON: ${{ steps.gate.outputs.result-json }}
        run: |
          set -euo pipefail
          test -n "$GRADE"
          test -n "$SCORE"
          test "$PASSED" = "true"
          test -s "$RESULT_JSON"
          test -s output/scorecard.html
          jq -e '.overall.score | numbers' "$RESULT_JSON" >/dev/null
