name: Verify GTFS Scorecard Action

on:
  workflow_dispatch:
  schedule:
    - cron: "31 14 * * 1"

permissions:
  contents: read

concurrency:
  group: action-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  protected-release:
    name: Protected release v1.3.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run GTFS Scorecard gate
        id: gate
        uses: ChelseaKR/gtfs-scorecard@715b8d5cd967522702842d46ab2c3b79c1b0a781 # v1.3.0
        with:
          feed-url: https://unitrans.ucdavis.edu/media/gtfs/Unitrans_GTFS.zip
          country: US
          name: Unitrans downstream smoke test
          json: output/scorecard.json
          html: output/scorecard.html

      - name: Verify outputs
        shell: bash
        env:
          GRADE: ${{ steps.gate.outputs.grade }}
          SCORE: ${{ steps.gate.outputs.score }}
          PASSED: ${{ steps.gate.outputs.passed }}
          RESULT_JSON: ${{ steps.gate.outputs.result-json }}
        run: |
          set -euo pipefail
          test -n "$GRADE"
          test -n "$SCORE"
          test "$PASSED" = "true"
          test -s "$RESULT_JSON"
          test -s output/scorecard.html
          jq -e '.overall.score | numbers' "$RESULT_JSON" >/dev/null

      - name: Retain protected-release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-release-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

  floating-major:
    name: Floating major v1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run GTFS Scorecard gate
        id: gate
        uses: ChelseaKR/gtfs-scorecard@715b8d5cd967522702842d46ab2c3b79c1b0a781 # v1 peeled 2026-07-23
        with:
          feed-url: https://unitrans.ucdavis.edu/media/gtfs/Unitrans_GTFS.zip
          country: US
          name: Unitrans downstream smoke test
          json: output/scorecard.json
          html: output/scorecard.html

      - name: Verify outputs
        shell: bash
        env:
          GRADE: ${{ steps.gate.outputs.grade }}
          SCORE: ${{ steps.gate.outputs.score }}
          PASSED: ${{ steps.gate.outputs.passed }}
          RESULT_JSON: ${{ steps.gate.outputs.result-json }}
        run: |
          set -euo pipefail
          test -n "$GRADE"
          test -n "$SCORE"
          test "$PASSED" = "true"
          test -s "$RESULT_JSON"
          test -s output/scorecard.html
          jq -e '.overall.score | numbers' "$RESULT_JSON" >/dev/null

      - name: Retain floating-major evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: floating-major-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
