name: Verify GTFS Scorecard Action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-release:
    name: Protected release v1.3.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out smoke assertions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run GTFS Scorecard gate
        id: gate
        uses: ChelseaKR/gtfs-scorecard@715b8d5cd967522702842d46ab2c3b79c1b0a781 # v1.3.0
        with:
          feed-url: https://unitrans.ucdavis.edu/media/gtfs/Unitrans_GTFS.zip
          country: US
          name: Unitrans downstream smoke test
          json: output/scorecard.json
          html: output/scorecard.html

      - name: Verify outputs
        shell: bash
        env:
          GRADE: ${{ steps.gate.outputs.grade }}
          SCORE: ${{ steps.gate.outputs.score }}
          PASSED: ${{ steps.gate.outputs.passed }}
          RESULT_JSON: ${{ steps.gate.outputs.result-json }}
          RESULT_HTML: output/scorecard.html
        run: |
          bash scripts/assert-scorecard-contract.sh

  floating-major:
    name: Floating major v1
    runs-on: ubuntu-latest
    steps:
      - name: Check out smoke assertions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run GTFS Scorecard gate
        id: gate
        uses: ChelseaKR/gtfs-scorecard@1407ba42c30bfccad11602c201db23bd514ae042 # v1 resolved 2026-07-23
        with:
          feed-url: https://unitrans.ucdavis.edu/media/gtfs/Unitrans_GTFS.zip
          country: US
          name: Unitrans downstream smoke test
          json: output/scorecard.json
          html: output/scorecard.html

      - name: Verify outputs
        shell: bash
        env:
          GRADE: ${{ steps.gate.outputs.grade }}
          SCORE: ${{ steps.gate.outputs.score }}
          PASSED: ${{ steps.gate.outputs.passed }}
          RESULT_JSON: ${{ steps.gate.outputs.result-json }}
          RESULT_HTML: output/scorecard.html
        run: |
          bash scripts/assert-scorecard-contract.sh
